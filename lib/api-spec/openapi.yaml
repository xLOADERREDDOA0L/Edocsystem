openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Engineering Document Control and Distribution Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: departments
    description: Department management
  - name: categories
    description: Document category management
  - name: documents
    description: Document management
  - name: revisions
    description: Document revision management
  - name: requests
    description: Document requests
  - name: printing
    description: Controlled printing
  - name: verification
    description: QR code verification
  - name: dashboard
    description: Dashboard and analytics
  - name: audit
    description: Audit trail
  - name: reports
    description: Reports
  - name: storage
    description: File storage

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
        "400":
          description: Invalid input

  # ─── USERS ──────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: number
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/disable:
    post:
      operationId: disableUser
      tags: [users]
      summary: Disable a user account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: User disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/enable:
    post:
      operationId: enableUser
      tags: [users]
      summary: Enable a user account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: User enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset a user's password (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset

  # ─── DEPARTMENTS ─────────────────────────────────────────────────────────────
  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List all departments
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}:
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  # ─── CATEGORIES ──────────────────────────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all document categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a document category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  # ─── DOCUMENTS ───────────────────────────────────────────────────────────────
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List and search documents
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: number
        - name: department
          in: query
          schema:
            type: number
        - name: page
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Paginated list of documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create a new document record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get document detail with current revision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetail"
        "404":
          description: Not found
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update document metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  # ─── REVISIONS ───────────────────────────────────────────────────────────────
  /documents/{id}/revisions:
    get:
      operationId: listRevisions
      tags: [revisions]
      summary: List all revisions for a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of revisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Revision"
    post:
      operationId: createRevision
      tags: [revisions]
      summary: Upload a new revision (file path from object storage)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionInput"
      responses:
        "201":
          description: Revision created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"

  /documents/{id}/revisions/{revId}/submit:
    post:
      operationId: submitRevision
      tags: [revisions]
      summary: Submit a draft revision for review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: revId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Revision submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"

  /documents/{id}/revisions/{revId}/approve:
    post:
      operationId: approveRevision
      tags: [revisions]
      summary: Approve a revision (generates QR code, marks previous revisions obsolete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: revId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Revision approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"

  /documents/{id}/revisions/{revId}/reject:
    post:
      operationId: rejectRevision
      tags: [revisions]
      summary: Reject a revision with reason
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: revId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionInput"
      responses:
        "200":
          description: Revision rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"

  # ─── DOCUMENT REQUESTS ───────────────────────────────────────────────────────
  /requests:
    get:
      operationId: listRequests
      tags: [requests]
      summary: List document requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: mine
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentRequest"
    post:
      operationId: createRequest
      tags: [requests]
      summary: Request access/print of a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentRequestInput"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequest"

  /requests/{id}/approve:
    post:
      operationId: approveRequest
      tags: [requests]
      summary: Approve a document request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Request approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequest"

  /requests/{id}/reject:
    post:
      operationId: rejectRequest
      tags: [requests]
      summary: Reject a document request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestRejectionInput"
      responses:
        "200":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequest"

  # ─── PRINTING ────────────────────────────────────────────────────────────────
  /print:
    post:
      operationId: printDocument
      tags: [printing]
      summary: Execute controlled print — verifies auth, creates transaction, generates QR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintInput"
      responses:
        "201":
          description: Print transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintTransaction"

  /print-transactions:
    get:
      operationId: listPrintTransactions
      tags: [printing]
      summary: List print transactions
      parameters:
        - name: documentId
          in: query
          schema:
            type: number
        - name: userId
          in: query
          schema:
            type: number
        - name: fromDate
          in: query
          schema:
            type: string
        - name: toDate
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of print transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrintTransaction"

  /print-transactions/{id}:
    get:
      operationId: getPrintTransaction
      tags: [printing]
      summary: Get print transaction detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Print transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintTransaction"

  # ─── QR VERIFICATION ─────────────────────────────────────────────────────────
  /verify/{token}:
    get:
      operationId: verifyQrCode
      tags: [verification]
      summary: Verify a document QR code token (public endpoint)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResult"

  # ─── DASHBOARD ───────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent system activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/document-status-breakdown:
    get:
      operationId: getDocumentStatusBreakdown
      tags: [dashboard]
      summary: Get document counts grouped by status
      responses:
        "200":
          description: Status breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusCount"

  /dashboard/print-activity:
    get:
      operationId: getPrintActivity
      tags: [dashboard]
      summary: Get print activity grouped by day for the past 30 days
      responses:
        "200":
          description: Print activity data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DayCount"

  /dashboard/top-documents:
    get:
      operationId: getTopDocuments
      tags: [dashboard]
      summary: Get most printed documents
      parameters:
        - name: limit
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Top documents by print count
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopDocument"

  # ─── AUDIT LOGS ──────────────────────────────────────────────────────────────
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit trail records
      parameters:
        - name: userId
          in: query
          schema:
            type: number
        - name: action
          in: query
          schema:
            type: string
        - name: module
          in: query
          schema:
            type: string
        - name: fromDate
          in: query
          schema:
            type: string
        - name: toDate
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

  # ─── REPORTS ─────────────────────────────────────────────────────────────────
  /reports/printing:
    get:
      operationId: getPrintingReport
      tags: [reports]
      summary: Printing history report summary
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
        - name: toDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Printing report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintingReport"

  /reports/distribution:
    get:
      operationId: getDistributionReport
      tags: [reports]
      summary: Document distribution report
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
        - name: toDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Distribution report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributionReport"

  /reports/revisions:
    get:
      operationId: getRevisionReport
      tags: [reports]
      summary: Revision history report
      responses:
        "200":
          description: Revision report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionReport"

  /reports/obsolete:
    get:
      operationId: getObsoleteReport
      tags: [reports]
      summary: Obsolete documents report
      responses:
        "200":
          description: Obsolete documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObsoleteDocumentItem"

  # ─── OBJECT STORAGE ──────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL for a document file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

  /storage/objects/{objectPath}:
    get:
      operationId: getObject
      tags: [storage]
      summary: Serve an uploaded object (auth required)
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File contents
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── AUTH ─────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      required: [id, employeeId, fullName, email, role, departmentId, status, mustChangePassword]
      properties:
        id:
          type: number
        employeeId:
          type: string
        fullName:
          type: string
        email:
          type: string
        role:
          type: string
        departmentId:
          type: ["number", "null"]
        departmentName:
          type: ["string", "null"]
        status:
          type: string
        mustChangePassword:
          type: boolean

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    # ─── USERS ────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, employeeId, fullName, email, role, status, createdAt]
      properties:
        id:
          type: number
        employeeId:
          type: string
        fullName:
          type: string
        email:
          type: string
        role:
          type: string
        departmentId:
          type: ["number", "null"]
        departmentName:
          type: ["string", "null"]
        status:
          type: string
        mustChangePassword:
          type: boolean
        lastLogin:
          type: ["string", "null"]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [employeeId, fullName, email, password, role]
      properties:
        employeeId:
          type: string
        fullName:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [administrator, document_controller, engineer, supervisor, employee, inspector]
        departmentId:
          type: ["number", "null"]
        mustChangePassword:
          type: boolean

    UserUpdate:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [administrator, document_controller, engineer, supervisor, employee, inspector]
        departmentId:
          type: ["number", "null"]

    ResetPasswordInput:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string

